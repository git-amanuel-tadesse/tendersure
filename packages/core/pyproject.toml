[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tendersure"
version = "0.1.0"
description = "TenderSure core: the criteria rules, the bank and the steps (flows) every app calls"
requires-python = ">=3.11"
# model steps use OpenRouter or Gemini over plain HTTPS: no vendor SDK needed
dependencies = ["openpyxl>=3.1", "pdfplumber>=0.11"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]
